# Runs Claude when someone with write access mentions @claude in an issue, PR comment, or review.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # Workaround for anthropics/claude-code-action#1901: the API answers "Credit balance is too low" to any request
      # carrying the action's CLAUDE_CODE_ENTRYPOINT or CLAUDE_CODE_ACTION, so Claude Code runs through a wrapper that
      # drops both. Remove this step and path_to_claude_code_executable once the issue is fixed.
      - name: Install Claude Code without the action markers
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          printf '#!/bin/sh\nunset CLAUDE_CODE_ENTRYPOINT CLAUDE_CODE_ACTION\nexec "%s" "$@"\n' "$HOME/.local/bin/claude" > "$RUNNER_TEMP/claude"
          chmod +x "$RUNNER_TEMP/claude"
      - uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ runner.temp }}/claude
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Agents that ask for opus, sonnet or haiku all resolve to Haiku 5.5, so every run stays on Haiku.
          settings: '{"env": {"ANTHROPIC_DEFAULT_OPUS_MODEL": "claude-haiku-5-5", "ANTHROPIC_DEFAULT_SONNET_MODEL": "claude-haiku-5-5", "ANTHROPIC_DEFAULT_HAIKU_MODEL": "claude-haiku-5-5"}}'
          claude_args: --model claude-haiku-5-5
