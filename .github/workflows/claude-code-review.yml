# Reviews each ready PR once with Anthropic's code-review plugin and posts inline comments.
# The plugin skips PRs Claude already commented on; ask "@claude" in the PR for follow-ups.
name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    # Drafts and bot PRs are skipped, and so are fork PRs, which get no secrets.
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The plugin asks for Opus on its bug agents; this maps the opus alias to Sonnet to keep cost down.
          settings: '{"env": {"ANTHROPIC_DEFAULT_OPUS_MODEL": "claude-sonnet-5-5"}}'
          # --allowedTools must name the inline-comment tool, or the action never starts its MCP server.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
