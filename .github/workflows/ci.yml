name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Lint the Firefox build
        run: pnpm dlx web-ext lint --source-dir apps/extension/.output/firefox-mv3 --self-hosted=false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          tags: browserlace-server:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name server -p 8787:8787 browserlace-server:ci
          for i in $(seq 30); do curl -fsS http://localhost:8787/healthz && exit 0; sleep 1; done
          docker logs server
          exit 1
      - name: Validate the Tailscale compose file
        run: TS_AUTHKEY=ci docker compose -f deploy/tailscale/compose.yml config --quiet
