name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Lint the Firefox build
        run: pnpm dlx web-ext lint --source-dir apps/extension/.output/firefox-mv3 --self-hosted=false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          tags: browserlace-server:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name server -p 8787:8787 browserlace-server:ci
          for i in $(seq 30); do curl -fsS http://localhost:8787/healthz && exit 0; sleep 1; done
          docker logs server
          exit 1
      - name: Back up with Litestream and restore onto an empty volume
        run: |
          mkdir -m 777 backup
          docker run -d --name primary -p 8788:8787 -v "$PWD/backup:/backup" -e LITESTREAM_REPLICA_URL=file:///backup/db browserlace-server:ci
          for i in $(seq 30); do curl -fsS http://localhost:8788/healthz && break; sleep 1; done
          token=$(curl -fsS -X POST http://localhost:8788/v1/accounts -H 'content-type: application/json' -d '{"name":"ci","browser":"chrome"}' | jq -r .token)
          sleep 3 && docker stop primary
          docker run -d --name restored -p 8789:8787 -v "$PWD/backup:/backup" -e LITESTREAM_REPLICA_URL=file:///backup/db browserlace-server:ci
          for i in $(seq 30); do curl -fsS http://localhost:8789/healthz && break; sleep 1; done
          curl -fsS http://localhost:8789/v1/me -H "authorization: Bearer $token" || { docker logs restored; exit 1; }
      - name: Validate the Tailscale compose file
        run: TS_AUTHKEY=ci docker compose -f deploy/tailscale/compose.yml config --quiet
