# Self-hosted BrowserLace on your tailnet, reachable only by your devices at
# https://browserlace.<your-tailnet>.ts.net. See deploy/tailscale/README.md.
services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: browserlace
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY to a Tailscale auth key}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    # Share the Tailscale container's network so `tailscale serve` can reach 127.0.0.1:8787.
    network_mode: service:tailscale
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  tailscale-state:
  data:
